# =============================================================================
# Recovery Journey - Production Docker Compose Override
# =============================================================================
# This is an OVERRIDE file. It must always be combined with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml <command>
#
# This override:
#   - Deploys the backend from a tagged registry image (BACKEND_IMAGE_TAG)
#     instead of building from source, so rollback can swap tags
#   - Removes volume mounts (uses built code)
#   - Hides the database port (internal network only)
#   - Adds resource limits and log rotation
#   - Requires all production secrets (fails fast when unset)
#
# Variable substitution is read from the shell environment and from a
# `.env` file in this directory (see deploy/production/.env.production
# for the template). Set BACKEND_IMAGE_TAG to the version being deployed.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database (Production)
  # ---------------------------------------------------------------------------
  db:
    restart: always
    environment:
      # These MUST be set via environment variables or .env file
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-recovery_journey}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Don't expose port in production (internal only).
    # `!reset` is required — a plain empty list is appended to the base
    # file's list and silently leaves the port published.
    ports: !reset []

  # ---------------------------------------------------------------------------
  # Backend API Server (Production)
  # ---------------------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/cleffnote44/recovery-journey/backend}:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: ./Backend
      target: production
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8000
      HOST: 0.0.0.0
      # These MUST be set via environment variables or .env file
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      AUDIT_LOG_RETENTION_DAYS: 2555
      # HIPAA: required in production — backend exits at startup without them
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:-}
      AUDIT_SECRET: ${AUDIT_SECRET:?AUDIT_SECRET is required}
      REGISTRATION_KEY_EXPIRES_HOURS: ${REGISTRATION_KEY_EXPIRES_HOURS:-72}
    # Remove dev bind mounts in production (`!reset` — see db.ports note)
    volumes: !reset []
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      replicas: 1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Migrations (Production)
  # ---------------------------------------------------------------------------
  # Runs `npx prisma migrate deploy` (command inherited from the base file)
  # using the same registry image as the backend, so the applied migrations
  # always match the deployed code.
  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/cleffnote44/recovery-journey/backend}:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: ./Backend
      target: production
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
