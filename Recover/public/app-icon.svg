<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rai-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#0f9e91"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="rai-glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rai-clip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>
  <!-- Rounded rectangle background — teal to emerald gradient -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#rai-bg)"/>
  <!-- Subtle top-down light overlay for depth -->
  <rect x="0" y="0" width="512" height="256" rx="112" ry="112" fill="url(#rai-glow)" clip-path="url(#rai-clip)"/>
  <!-- Logo mark in white — scaled and centered -->
  <g transform="translate(96, 80) scale(5)">
    <!-- Background paths -->
    <path d="M10 54 C14 48, 16 42, 20 38 C24 34, 26 32, 28 30 C30 28, 31 26, 33 24 C35 22, 38 18, 42 15 C46 12, 50 10, 54 10"
          stroke="white" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.2"/>
    <path d="M14 56 C18 48, 20 42, 24 36 C28 30, 30 28, 32 26 C34 24, 36 22, 38 20 C40 18, 43 14, 47 11 C51 8, 54 7, 56 8"
          stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.35"/>
    <!-- Main ascending path -->
    <path d="M8 58 C14 50, 18 44, 22 38 C26 32, 28 28, 32 24 C36 20, 40 16, 44 13 C48 10, 52 8, 56 6"
          stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Human figure -->
    <g transform="translate(54, 4)">
      <circle cx="2" cy="2" r="3.2" fill="white"/>
      <path d="M2 5 L2 12 M-2 7 L2 5 L6 7" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M2 12 L-1 17 M2 12 L5 17" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
    <!-- Sunrise rays -->
    <g opacity="0.45">
      <line x1="50" y1="4" x2="46" y2="0" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="54" y1="2" x2="54" y2="-3" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="58" y1="4" x2="62" y2="0" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- Milestone dots -->
    <circle cx="12" cy="55" r="1.8" fill="white" opacity="0.35"/>
    <circle cx="22" cy="38" r="2" fill="white" opacity="0.5"/>
    <circle cx="32" cy="24" r="2.2" fill="white" opacity="0.65"/>
    <circle cx="44" cy="13" r="2.4" fill="white" opacity="0.8"/>
  </g>
</svg>