name: Scheduled Database Backup

on:
  schedule:
    # Daily at 7:17 UTC (3:17 AM EDT / 2:17 AM EST — off-peak, avoid :00/:30 load spikes)
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to backup'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

jobs:
  # Scheduled runs back up both environments; manual dispatch backs up
  # only the selected one.
  plan:
    name: Plan Backup Targets
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.plan.outputs.environments }}
    steps:
      - name: Determine environments
        id: plan
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'environments=["${{ github.event.inputs.environment }}"]' >> $GITHUB_OUTPUT
          else
            echo 'environments=["production","staging"]' >> $GITHUB_OUTPUT
          fi

  # NOTE: this job declares no `environment:` (scheduled runs must not block
  # on environment protection rules), so DEPLOY_SSH_KEY / *_HOST /
  # SSH_KNOWN_HOSTS must be REPOSITORY-level secrets, not environment-scoped.
  backup:
    name: Database Backup (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.plan.outputs.environments) }}
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      STAGING_HOST: ${{ secrets.STAGING_HOST }}

    steps:
      # Fail closed: a missing host secret must abort, never silently fall
      # back to the other environment's host.
      - name: Resolve deploy host
        run: |
          if [ "${{ matrix.environment }}" = "production" ]; then
            HOST="$PRODUCTION_HOST"
          else
            HOST="$STAGING_HOST"
          fi
          if [ -z "$HOST" ]; then
            echo "::error::Host secret for environment '${{ matrix.environment }}' is not set"
            exit 1
          fi
          echo "DEPLOY_HOST=$HOST" >> $GITHUB_ENV

      - name: Setup SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS secret is required (run 'ssh-keyscan <host>' for each deploy host and store the output)"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run backup
        run: |
          echo "Running ${{ matrix.environment }} database backup..."
          # backup.sh reserves stdout for the produced backup path
          BACKUP_PATH=$(ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cd /opt/recovery-journey && ./scripts/backup.sh ${{ matrix.environment }} --quiet')
          if [ -z "$BACKUP_PATH" ]; then
            echo "::error::backup.sh did not report a backup path"
            exit 1
          fi
          echo "BACKUP_PATH=$BACKUP_PATH" >> $GITHUB_ENV
          echo "Backup created: $BACKUP_PATH"

      - name: Verify backup
        run: |
          echo "Verifying backup file on the host..."
          case "$BACKUP_PATH" in
            *.enc) ;;
            *)
              echo "::error::Backup is not encrypted: $BACKUP_PATH"
              exit 1
              ;;
          esac
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "test -s '$BACKUP_PATH'" || {
            echo "::error::Backup file is missing or empty: $BACKUP_PATH"
            exit 1
          }
          echo "Verified: $BACKUP_PATH"

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Notify backup failure
        if: failure()
        run: |
          echo "::error::${{ matrix.environment }} database backup FAILED"
