name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Node 22 LTS — required by Vite 7 (needs >=20.19 || >=22.12) and matches the
  # Backend Docker base image.
  NODE_VERSION: '22'

jobs:
  # ===========================================
  # Backend CI
  # ===========================================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Run ESLint
        run: pnpm run lint

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: ./Backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recovery_journey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Run database migrations
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recovery_journey_test?schema=public

      - name: Run tests
        run: pnpm run test:run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recovery_journey_test?schema=public
          JWT_SECRET: test-jwt-secret-for-ci-testing-only-not-for-production
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-testing-only-not-for-production
          NODE_ENV: test

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          directory: ./Backend/coverage
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Build
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: ./Backend/dist
          retention-days: 7

  # ===========================================
  # Journey (Staff Desktop App) CI
  # ===========================================
  journey-lint:
    name: Journey Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Journey

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

  journey-test:
    name: Journey Tests
    runs-on: ubuntu-latest
    needs: journey-lint
    defaults:
      run:
        working-directory: ./Journey

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:run

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          directory: ./Journey/coverage
          flags: journey
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  journey-build:
    name: Journey Build
    runs-on: ubuntu-latest
    needs: journey-test
    defaults:
      run:
        working-directory: ./Journey

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  journey-e2e:
    name: Journey E2E
    runs-on: ubuntu-latest
    needs: journey-build
    # Informational: the Playwright suite predates CI and has never passed
    # here (pre-existing spec/UI drift; remaining failures tracked for a
    # dedicated stabilization pass). Failures are surfaced in the logs and
    # the uploaded playwright-report artifact but do not gate merges —
    # consistent with the dependency-audit jobs.
    continue-on-error: true
    defaults:
      run:
        working-directory: ./Journey

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ./Journey/playwright-report/
          retention-days: 7

  # ===========================================
  # Recover (Patient Mobile App) CI
  # ===========================================
  recover-lint:
    name: Recover Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Recover

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      # No `tsc --noEmit` gate here: Recover ships via esbuild (Vite) and has
      # pre-existing type errors that are tracked separately — type-checking is
      # not a merge gate for this workspace (Backend/Journey are clean and do
      # run tsc).

  recover-test:
    name: Recover Tests
    runs-on: ubuntu-latest
    needs: recover-lint
    defaults:
      run:
        working-directory: ./Recover

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:run

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          directory: ./Recover/coverage
          flags: recover
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  recover-build:
    name: Recover Build
    runs-on: ubuntu-latest
    needs: recover-test
    defaults:
      run:
        working-directory: ./Recover

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  # ===========================================
  # Docker Build Verification
  # ===========================================
  # The Backend image is built standalone from ./Backend (its own
  # package-lock.json + npm), independent of the pnpm workspace. Unchanged by
  # the pnpm migration.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          tags: recovery-journey-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # Dependency Audit
  # ===========================================
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit workspace dependencies (pnpm)
        # Hard gate: fail CI on any new high/critical dependency CVE in the
        # pnpm workspace. The tree is at zero after the CVE remediation, so this
        # keeps regressions from landing.
        run: pnpm audit --audit-level=high

  # ===========================================
  # Security Scanning
  # ===========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (hard gate)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          # Hard gate: fail CI on any fixable CRITICAL/HIGH found anywhere Trivy's
          # filesystem scan reaches — including out-of-workspace manifests
          # (website/package-lock.json, Backend/package-lock.json) that the pnpm
          # workspace `pnpm audit` gate does not cover. Readable table output
          # lands in the job log for triage.
          exit-code: '1'

      - name: Run Trivy vulnerability scanner (SARIF report)
        uses: aquasecurity/trivy-action@master
        # Always build the report, even when the gate above failed, so findings
        # are uploaded to code scanning for triage. The DB is cached from the
        # gate step, so this second pass is fast.
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        # Best-effort: a code-scanning upload hiccup (token/permission) must not
        # block CI — the gate step above already enforces the policy.
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  # ===========================================
  # Final Status Check
  # ===========================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - journey-build
      - journey-e2e
      - recover-build
      - docker-build
      - security-scan
      - dependency-audit
    if: always()

    steps:
      - name: Check all jobs passed
        # journey-e2e is intentionally absent: it is informational
        # (continue-on-error) until the Playwright suite is stabilized.
        run: |
          if [[ "${{ needs.backend-build.result }}" != "success" ]] || \
             [[ "${{ needs.journey-build.result }}" != "success" ]] || \
             [[ "${{ needs.recover-build.result }}" != "success" ]] || \
             [[ "${{ needs.docker-build.result }}" != "success" ]] || \
             [[ "${{ needs.security-scan.result }}" != "success" ]] || \
             [[ "${{ needs.dependency-audit.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
