name: CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# Default to read-only; jobs that need more declare it explicitly
permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================
  # Determine Deployment Environment
  # ===========================================
  setup:
    name: Setup Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      version: ${{ steps.set-version.outputs.version }}
      image: ${{ steps.set-image.outputs.image }}

    steps:
      - name: Guard production dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "production" && "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Manual production deployments must be dispatched from main (got ${{ github.ref }})"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Set version
        id: set-version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(git describe --tags --always)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Set image name
        id: set-image
        run: |
          # Registry repositories must be lowercase
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> $GITHUB_OUTPUT

  # ===========================================
  # Build and Push Docker Images
  # ===========================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.setup.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          target: production
          push: true
          # The explicit version tag is what the deploy step pulls — it must
          # match needs.setup.outputs.version exactly so the image deployed
          # is the image built from this commit.
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ needs.setup.outputs.image }}:${{ needs.setup.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.setup.outputs.version }}

  # ===========================================
  # Deploy (staging on main pushes, production on v* tags)
  # ===========================================
  deploy:
    name: Deploy to ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [setup, build-backend]
    # packages: read lets the GITHUB_TOKEN piped to the deploy host pull the
    # (private) backend image from GHCR
    permissions:
      contents: read
      packages: read
    # Never run two deploys against the same host at once
    concurrency:
      group: deploy-${{ needs.setup.outputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.setup.outputs.environment }}
      url: ${{ needs.setup.outputs.environment == 'production' && 'https://recoveryjourney.app' || 'https://staging.recoveryjourney.app' }}
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      API_URL: ${{ needs.setup.outputs.environment == 'production' && 'https://api.recoveryjourney.app' || 'https://staging-api.recoveryjourney.app' }}
      ENV_NAME: ${{ needs.setup.outputs.environment }}
      VERSION: ${{ needs.setup.outputs.version }}

    steps:
      # Fail closed: a missing host secret must abort, never silently fall
      # back to the other environment's host.
      - name: Resolve deploy host
        run: |
          if [ "$ENV_NAME" = "production" ]; then
            HOST="$PRODUCTION_HOST"
          else
            HOST="$STAGING_HOST"
          fi
          if [ -z "$HOST" ]; then
            echo "::error::Host secret for environment '$ENV_NAME' is not set"
            exit 1
          fi
          echo "DEPLOY_HOST=$HOST" >> $GITHUB_ENV

      - name: Setup SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS secret is required (run 'ssh-keyscan <host>' for each deploy host and store the output)"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Capture currently deployed version
        run: |
          PREVIOUS_VERSION=$(ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cat /opt/recovery-journey/.deployed_version 2>/dev/null || echo "none"')
          echo "PREVIOUS_VERSION=${PREVIOUS_VERSION}" >> $GITHUB_ENV
          echo "Previous version: ${PREVIOUS_VERSION}"

      - name: Log in to registry on deploy host
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy
        run: |
          echo "Deploying version ${VERSION} to ${ENV_NAME}..."
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' << 'EOF'
            set -euo pipefail
            cd /opt/recovery-journey

            # Sync compose files & scripts to the deployed commit first so the
            # backup and deploy below run the reviewed versions.
            git fetch origin --tags --prune --force
            git checkout --detach ${{ github.sha }}

            # Pre-deployment backup — a deploy without a fresh backup is not
            # allowed to proceed (HIPAA: recoverability).
            ./scripts/backup.sh ${{ needs.setup.outputs.environment }} --quiet

            export BACKEND_IMAGE_TAG='${{ needs.setup.outputs.version }}'
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend
            # < /dev/null is required: this script arrives on the host via
            # `bash -s` stdin, and `compose run` attaches stdin by default —
            # it would consume the remaining script lines into the container.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm migrate < /dev/null
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build --remove-orphans db backend

            if [ -f .deployed_version ]; then cp .deployed_version .deployed_version.previous; fi
            echo '${{ needs.setup.outputs.version }}' > .deployed_version
          EOF

      - name: Verify deployment
        id: health_check
        run: |
          echo "Verifying ${ENV_NAME} deployment..."
          sleep 15

          echo "Checking backend health on the deploy host..."
          for i in 1 2 3; do
            if ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'curl -sf http://localhost:8000/health > /dev/null'; then
              echo "Local health check passed (attempt $i)"
              break
            fi
            if [ "$i" = "3" ]; then
              echo "::error::Local health check failed after 3 attempts"
              exit 1
            fi
            echo "Local health check failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done

          echo "Checking public endpoint..."
          for i in 1 2 3; do
            if curl -sf "${API_URL}/health" > /dev/null; then
              echo "Public health check passed (attempt $i)"
              exit 0
            fi
            echo "Public health check failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
          echo "::error::Public health check failed after 3 attempts"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.health_check.outcome == 'failure'
        run: |
          echo "::error::Deployment failed — rolling back to ${PREVIOUS_VERSION}"
          if [ "${PREVIOUS_VERSION}" != "none" ]; then
            ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' << EOF
              set -euo pipefail
              cd /opt/recovery-journey
              export BACKEND_IMAGE_TAG='${PREVIOUS_VERSION}'
              docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend || true
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build --no-deps backend
              echo '${PREVIOUS_VERSION}' > .deployed_version
          EOF
            echo "Rolled back to ${PREVIOUS_VERSION}"
          else
            echo "::error::No previous version recorded — the failed deploy is still live and needs manual intervention"
          fi

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Notify deployment success
        if: success()
        run: echo "${ENV_NAME} deployment of ${VERSION} successful!"

      - name: Notify deployment failure
        if: failure()
        run: echo "::error::${ENV_NAME} deployment FAILED for version ${VERSION}"

  # ===========================================
  # GitHub Release (tagged production deploys)
  # ===========================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================
  # Build Desktop App (Journey)
  # ===========================================
  build-desktop:
    name: Build Desktop App
    runs-on: ${{ matrix.os }}
    needs: setup
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './Journey/package-lock.json'

      - name: Install dependencies
        working-directory: ./Journey
        run: npm ci

      - name: Build Electron app
        working-directory: ./Journey
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ./Journey/dist-electron/*
          retention-days: 30

  # ===========================================
  # Build Mobile App (Recover)
  # ===========================================
  build-mobile-android:
    name: Build Android App
    runs-on: ubuntu-latest
    needs: setup
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './Recover/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ./Recover
        run: npm ci

      - name: Build web assets
        working-directory: ./Recover
        run: npm run build

      - name: Sync Capacitor
        working-directory: ./Recover
        run: npx cap sync android

      - name: Build Android APK
        working-directory: ./Recover/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ./Recover/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  build-mobile-ios:
    name: Build iOS App
    runs-on: macos-latest
    needs: setup
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './Recover/package-lock.json'

      - name: Install dependencies
        working-directory: ./Recover
        run: npm ci

      - name: Build web assets
        working-directory: ./Recover
        run: npm run build

      - name: Sync Capacitor
        working-directory: ./Recover
        run: npx cap sync ios

      - name: Build iOS app
        working-directory: ./Recover/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ./Recover/ios/App/build/
          retention-days: 30
