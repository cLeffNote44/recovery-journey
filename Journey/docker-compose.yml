services:
  # Development service - runs Vite dev server
  dev:
    build:
      context: .
      target: development
    container_name: recover-portal-dev
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot-reload
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
      # Prevent overwriting node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npx vite --host 0.0.0.0
    networks:
      - recover-network

  # Builder service - for building distributable packages
  builder:
    build:
      context: .
      target: builder
    container_name: recover-portal-builder
    volumes:
      # Mount release directory to extract built packages
      - ./release:/app/release
      # Prevent overwriting node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=production
    command: npm run build
    networks:
      - recover-network

