<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="og-mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="og-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="og-badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <style>
    .og-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 700; font-size: 48px; }
    .og-tagline { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; letter-spacing: 2px; }
    .og-badge-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 600; font-size: 14px; fill: #0d9488; letter-spacing: 1.5px; }
  </style>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <!-- Subtle grid pattern for texture -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#94a3b8" stroke-width="1" transform="translate(100,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#94a3b8" stroke-width="1" transform="translate(200,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#94a3b8" stroke-width="1" transform="translate(300,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#94a3b8" stroke-width="1" transform="translate(400,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#94a3b8" stroke-width="1" transform="translate(500,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#94a3b8" stroke-width="1" transform="translate(600,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#94a3b8" stroke-width="1" transform="translate(700,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#94a3b8" stroke-width="1" transform="translate(800,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#94a3b8" stroke-width="1" transform="translate(900,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#94a3b8" stroke-width="1" transform="translate(1000,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" stroke="#94a3b8" stroke-width="1" transform="translate(1100,0)"/>
  </g>
  <!-- Logo mark — centered, scaled -->
  <g transform="translate(510, 110) scale(3.2)">
    <!-- Background paths -->
    <path d="M10 54 C14 48, 16 42, 20 38 C24 34, 26 32, 28 30 C30 28, 31 26, 33 24 C35 22, 38 18, 42 15 C46 12, 50 10, 54 10"
          stroke="url(#og-mark)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.2"/>
    <path d="M14 56 C18 48, 20 42, 24 36 C28 30, 30 28, 32 26 C34 24, 36 22, 38 20 C40 18, 43 14, 47 11 C51 8, 54 7, 56 8"
          stroke="url(#og-mark)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.35"/>
    <!-- Main ascending path -->
    <path d="M8 58 C14 50, 18 44, 22 38 C26 32, 28 28, 32 24 C36 20, 40 16, 44 13 C48 10, 52 8, 56 6"
          stroke="url(#og-mark)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Human figure -->
    <g transform="translate(54, 4)">
      <circle cx="2" cy="2" r="3.2" fill="url(#og-mark)"/>
      <path d="M2 5 L2 12 M-2 7 L2 5 L6 7" stroke="url(#og-mark)" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M2 12 L-1 17 M2 12 L5 17" stroke="url(#og-mark)" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
    <!-- Sunrise rays -->
    <g opacity="0.35">
      <line x1="50" y1="4" x2="46" y2="0" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="54" y1="2" x2="54" y2="-3" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="58" y1="4" x2="62" y2="0" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- Milestone dots -->
    <circle cx="12" cy="55" r="1.8" fill="url(#og-mark)" opacity="0.4"/>
    <circle cx="22" cy="38" r="2" fill="url(#og-mark)" opacity="0.55"/>
    <circle cx="32" cy="24" r="2.2" fill="url(#og-mark)" opacity="0.7"/>
    <circle cx="44" cy="13" r="2.4" fill="url(#og-mark)" opacity="0.85"/>
  </g>
  <!-- "Recovery Journey" text -->
  <text x="600" y="380" text-anchor="middle" class="og-title" fill="white">Recovery<tspan fill="#0d9488" font-weight="700"> Journey</tspan></text>
  <!-- Tagline -->
  <text x="600" y="420" text-anchor="middle" class="og-tagline">HIPAA-COMPLIANT RECOVERY MANAGEMENT</text>
  <!-- Divider line -->
  <rect x="200" y="460" width="800" height="1" fill="url(#og-line)"/>
  <!-- Trust badges row -->
  <g transform="translate(0, 0)">
    <!-- Badge 1: HIPAA -->
    <g transform="translate(260, 490)">
      <rect x="0" y="0" width="160" height="48" rx="8" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.5"/>
      <rect x="0" y="0" width="160" height="48" rx="8" fill="url(#og-badge)" opacity="0.5"/>
      <!-- Shield icon -->
      <path d="M24 14 L24 28 C24 34, 32 38, 32 38 C32 38, 40 34, 40 28 L40 14 L32 10 Z" fill="none" stroke="#0d9488" stroke-width="1.5"/>
      <path d="M29 24 L31 26 L36 21" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="92" y="30" text-anchor="middle" class="og-badge-text">HIPAA</text>
    </g>
    <!-- Badge 2: 42 CFR Part 2 -->
    <g transform="translate(460, 490)">
      <rect x="0" y="0" width="200" height="48" rx="8" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.5"/>
      <rect x="0" y="0" width="200" height="48" rx="8" fill="url(#og-badge)" opacity="0.5"/>
      <!-- Document icon -->
      <path d="M24 12 L36 12 L40 16 L40 36 L24 36 Z" fill="none" stroke="#0d9488" stroke-width="1.5"/>
      <path d="M36 12 L36 16 L40 16" fill="none" stroke="#0d9488" stroke-width="1.5"/>
      <line x1="28" y1="22" x2="36" y2="22" stroke="#0d9488" stroke-width="1" opacity="0.5"/>
      <line x1="28" y1="26" x2="36" y2="26" stroke="#0d9488" stroke-width="1" opacity="0.5"/>
      <line x1="28" y1="30" x2="34" y2="30" stroke="#0d9488" stroke-width="1" opacity="0.5"/>
      <text x="112" y="30" text-anchor="middle" class="og-badge-text">42 CFR PART 2</text>
    </g>
    <!-- Badge 3: 256-bit Encryption -->
    <g transform="translate(700, 490)">
      <rect x="0" y="0" width="220" height="48" rx="8" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.5"/>
      <rect x="0" y="0" width="220" height="48" rx="8" fill="url(#og-badge)" opacity="0.5"/>
      <!-- Lock icon -->
      <rect x="28" y="22" width="12" height="10" rx="2" fill="none" stroke="#0d9488" stroke-width="1.5"/>
      <path d="M30 22 L30 18 C30 14, 38 14, 38 18 L38 22" fill="none" stroke="#0d9488" stroke-width="1.5"/>
      <circle cx="34" cy="27" r="1.5" fill="#10b981"/>
      <text x="122" y="30" text-anchor="middle" class="og-badge-text">256-BIT ENCRYPTION</text>
    </g>
  </g>
  <!-- Subtle corner accents -->
  <path d="M40 0 L0 0 L0 40" fill="none" stroke="#0d9488" stroke-width="2" opacity="0.15"/>
  <path d="M1160 630 L1200 630 L1200 590" fill="none" stroke="#0d9488" stroke-width="2" opacity="0.15"/>
</svg>